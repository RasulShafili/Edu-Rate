services:
  - type: web
    name: edurate-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Xarici idarə olunan Postgres (Neon/Supabase). Render dashboard →
      # Environment bölməsində Neon connection string-ini əl ilə qoy.
      # Neon üçün ?sslmode=require saxla, ?channel_binding=require-i sil.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        value: https://edu-rate-nu.vercel.app
      - key: TRUST_PROXY
        value: "true"
      # Vercel-dəki EDURATE_PROXY_SECRET ilə EYNİ dəyər (openssl rand -base64 48).
      # Olmasa giriş/qeydiyyat limitləri bütün istifadəçilər üçün ortaq olur.
      - key: EDURATE_PROXY_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUBLIC_APP_URL
        value: https://edu-rate-nu.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        value: edurate-secure
      # Web push açarları: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@edurate.az
